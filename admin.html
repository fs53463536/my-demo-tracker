<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroVanta Admin</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">

    <div class="logo">
        <strong>AEROVANTA</strong>
        <span>GLOBAL LOGISTICS</span>
    </div>

</header>


<section class="tracking-section">

    <div class="section-heading">

        <p class="eyebrow">SHIPMENT MANAGEMENT</p>

        <h2>Create Shipment</h2>

        <p>
            Create and manage shipment records.
        </p>

    </div>


    <div class="tracking-search"
        style="display:block; max-width:700px; margin:0 auto;">

        <h3>Sender Information</h3>

        <input
            type="text"
            id="adminSender"
            placeholder="Sender name"
            autocomplete="off">

        <br><br>

        <input
            type="text"
            id="adminSenderCountry"
            placeholder="Sender country"
            autocomplete="off">

        <br><br>

        <input
            type="text"
            id="adminSenderLocation"
            placeholder="Sender location / city"
            autocomplete="off">

        <br><br>


        <h3>Receiver Information</h3>

        <input
            type="text"
            id="adminRecipient"
            placeholder="Recipient name"
            autocomplete="off">

        <br><br>

        <input
            type="text"
            id="adminCountry"
            placeholder="Recipient country"
            autocomplete="off">

        <br><br>

        <input
            type="text"
            id="adminDestination"
            placeholder="Destination / City"
            autocomplete="off">

        <br><br>


        <h3>Shipment Details</h3>

        <input
            type="text"
            id="adminAirport"
            placeholder="Nearest airport"
            autocomplete="off">

        <br><br>

        <input
            type="text"
            id="adminPackage"
            placeholder="Package type"
            autocomplete="off">

        <br><br>

        <input
            type="text"
            id="adminWeight"
            placeholder="Weight (kg)"
            autocomplete="off">

        <br><br>

        <select id="adminStatus">

            <option value="Processing">
                Processing
            </option>

            <option value="Picked Up">
                Picked Up
            </option>

            <option value="In Transit">
                In Transit
            </option>

            <option value="Arrived">
                Arrived
            </option>

            <option value="Delivered">
                Delivered
            </option>

        </select>

        <br><br>

        <button onclick="createShipment()">
            Generate Shipment
        </button>

    </div>



    <div class="section-heading" style="margin-top:60px;">

        <p class="eyebrow">
            STATUS MANAGEMENT
        </p>

        <h2>Update Shipment</h2>

        <p>
            Update the current status of an existing shipment.
        </p>

    </div>


    <div class="tracking-search"
        style="display:block; max-width:700px; margin:0 auto;">

        <input
            type="text"
            id="updateTracking"
            placeholder="Enter tracking number"
            autocomplete="off">

        <br><br>

        <select id="updateStatus">

            <option value="Processing">
                Processing
            </option>

            <option value="Picked Up">
                Picked Up
            </option>

            <option value="In Transit">
                In Transit
            </option>

            <option value="Arrived">
                Arrived
            </option>

            <option value="Delivered">
                Delivered
            </option>

        </select>

        <br><br>

        <button onclick="updateShipmentStatus()">
            Update Shipment Status
        </button>

    </div>

</section>


<script src="script.js"></script>

</body>
</html>
